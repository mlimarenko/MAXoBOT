[workspace]
resolver = "2"
members = [
    "crates/maxobot",
    "crates/maxobot-core",
    "crates/maxobot-dispatch",
    "crates/maxobot-webhook",
]
default-members = ["crates/maxobot"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/mlimarenko/MAXoBOT"
authors = ["MAXoBOT Contributors"]
keywords = ["max", "messenger", "bot", "sdk"]
categories = ["api-bindings", "asynchronous"]

[workspace.dependencies]
async-trait = "0.1.88"
axum = { version = "0.8.1", default-features = false, features = ["http1", "json", "tokio"] }
bytes = "1.10.0"
chrono = { version = "0.4.40", default-features = false, features = ["clock", "serde"] }
futures = "0.3.31"
http = "1.2.0"
mime = "0.3.17"
parking_lot = "0.12.3"
reqwest = { version = "0.12.12", default-features = false, features = ["http2", "json"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
tokio = { version = "1.43.0", default-features = false }
tower = { version = "0.5.2", default-features = false, features = ["util"] }
tracing = "0.1.41"
url = { version = "2.5.4", features = ["serde"] }
uuid = { version = "1.15.1", features = ["serde", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "warn"
unused_crate_dependencies = "warn"
unused_qualifications = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cognitive_complexity = "allow"
missing_const_for_fn = "allow"
derive_partial_eq_without_eq = "allow"
struct_field_names = "allow"
return_self_not_must_use = "allow"
trivially_copy_pass_by_ref = "allow"
field_reassign_with_default = "allow"
option_if_let_else = "allow"
map_unwrap_or = "allow"
needless_pass_by_value = "allow"
implicit_clone = "allow"
redundant_clone = "allow"
