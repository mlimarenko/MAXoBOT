name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Форматирование (rustfmt)
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Установить Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Кэшировать Rust артефакты
        uses: Swatinem/rust-cache@v2
      - name: Проверить rustfmt
        run: cargo fmt --all -- --check

  clippy:
    name: Линт (clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Установить Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Кэшировать Rust артефакты
        uses: Swatinem/rust-cache@v2
      - name: Проверить clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Тесты (workspace)
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Установить Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Кэшировать Rust артефакты
        uses: Swatinem/rust-cache@v2
      - name: Запустить тесты workspace
        run: cargo test --workspace --all-features

  contract-tests:
    name: Тесты (контрактные)
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Установить Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Кэшировать Rust артефакты
        uses: Swatinem/rust-cache@v2
      - name: Запустить контрактные тесты
        run: cargo test --workspace --all-features contract::

  examples-build:
    name: Сборка примеров
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Установить Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Кэшировать Rust артефакты
        uses: Swatinem/rust-cache@v2
      - name: Собрать examples
        run: cargo build --workspace --all-features --examples
